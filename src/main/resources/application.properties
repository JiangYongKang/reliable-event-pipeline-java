spring.application.name=reliable-event-pipeline-java

# 可靠事件管道配置
pipeline.max-delivery-attempts=3
pipeline.backoff-base=100ms
pipeline.claim-timeout=5s
pipeline.effect-lease-timeout=10s
# 派发工作线程数
pipeline.worker-threads=4
# 派发轮询间隔
pipeline.poll-interval=20ms
# 延迟事件等待时长上限（自提交时刻起）；0 表示不限制，超过仍未到点的延迟事件进入死信(DELAY_LIMIT_EXCEEDED)
pipeline.max-delay=24h
# 单聚合未完成事件数上限；0 表示不限制，超过后新提交被拒绝(HTTP 429 / BacklogLimitExceededException)
pipeline.max-backlog-per-aggregate=0
# 状态文件路径（进程内可恢复存储）
pipeline.store-file=data/pipeline-store.json
